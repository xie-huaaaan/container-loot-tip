plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "container-loot-tip-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main {
        java.srcDir 'src/common/java'
        resources.srcDir 'src/common/resources'
    }
}

repositories {
    // ModDevGradle adds the official NeoForged repositories. In restricted networks,
    // pass -Pneoforge_mirror=https://neoforged.forgecdn.net to replace them with a mirror.
    def neoforgeMirror = findProperty('neoforge_mirror')

    if (neoforgeMirror != null) {
        def baseUrl = neoforgeMirror.toString().replaceAll('/+$', '')
        clear()
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = "${baseUrl}/releases" }
        maven { url = "${baseUrl}/mojang-meta" }
        mavenCentral()
    }

    flatDir {
        dirs "${deps_dir}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    def opt = { String name, String version -> files(new File(project.file(deps_dir), "${name}-${version}.jar")) }
    compileOnly opt('lootr', lootr_version)
    compileOnly opt('ali', ali_version)
    compileOnly opt('aci', aci_version)
    compileOnly opt('jei', jei_version)
    compileOnly opt('emi', emi_version)

    localRuntime opt('lootr', lootr_version)
    localRuntime opt('ali', ali_version)
    localRuntime opt('aci', aci_version)
    localRuntime opt('jei', jei_version)
    // EMI is toggled by a Gradle property because ALI loads both viewer plugins at once.
    if (project.findProperty('with_emi') == 'true') {
        localRuntime opt('emi', emi_version)
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
